[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-dimensional-inspection"
version = "0.1.0"
description = "Offline planar rectangle measurement from calibrated grayscale images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
